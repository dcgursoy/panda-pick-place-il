# A second, isolated environment used only for the LeRobot cross-check:
# loading our exported LeRobotDataset, training LeRobot's diffusion policy on it,
# and rolling that checkpoint out in our environment.
#
# LeRobot 0.6.1 pins torch < 2.12, torchvision < 0.27 and numpy < 2.3, which is
# why it cannot share the main environment (torch 2.15). Both environments use
# Python 3.12 and the Intel XPU build of torch.
#
#   cd tools/lerobot_env
#   uv sync
#   uv run lerobot-info
[project]
name = "panda-il-lerobot-env"
version = "0.1.0"
description = "Isolated environment for the LeRobot cross-check of panda-pick-place-il"
requires-python = ">=3.12,<3.13"
dependencies = [
    "panda-pick-place-il",
    "lerobot[dataset,diffusion]==0.6.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchcodec==0.11.1",
]

[tool.uv]
package = false
# The PyTorch XPU index also hosts stale copies of common packages; with the
# default first-index strategy that breaks resolution, so let uv pick the best
# version across indexes for this environment (the research pass verified this
# combination resolves).
index-strategy = "unsafe-best-match"

[tool.uv.sources]
panda-pick-place-il = { path = "../..", editable = true }
torch = { index = "pytorch-xpu" }
torchvision = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
